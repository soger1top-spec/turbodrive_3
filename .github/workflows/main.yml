name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: "apk-build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Free Space & RAM
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc
        sudo apt-get clean

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        python -m pip install --upgrade pip setuptools
        python -m pip install "cython==0.29.36" virtualenv buildozer

    - name: Extract Files
      run: |
        unzip -o turbodrive.zip -d temp_extract
        if [ -d "temp_extract/turbodrive" ]; then
          cp -r temp_extract/turbodrive/. .
        else
          cp -r temp_extract/. .
        fi

    - name: Configure Buildozer Spec
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi

        python3 -c "
        import re

        spec_file = 'buildozer.spec'
        with open(spec_file, 'r') as f:
            content = f.read()

        settings = {
            'title': 'TurboDrive',
            'package.name': 'turbodrive',
            'android.accept_sdk_license': 'True',
            'android.api': '33',
            'android.ndk': '25b',
            'android.archs': 'arm64-v8a'
        }

        # تنظيف أي أسطر مكررة لمنع DuplicateOptionError
        for key in settings.keys():
            content = re.sub(rf'^\s*#?\s*{re.escape(key)}\s*=.*$', '', content, flags=re.MULTILINE)

        # إضافة الإعدادات النظيفة تحت قسم [app]
        app_settings = '\n'.join([f'{k} = {v}' for k, v in settings.items()])
        content = content.replace('[app]', f'[app]\n{app_settings}')

        with open(spec_file, 'w') as f:
            f.write(content)
        "

    - name: Build APK
      run: |
        python -m pip install "cython==0.29.36" --force-reinstall
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
