name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: "apk-build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Free Space & RAM
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc
        sudo apt-get clean

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        python -m pip install --upgrade pip setuptools
        python -m pip install "cython==0.29.36" virtualenv buildozer

    - name: Extract Files
      run: |
        unzip -o turbodrive.zip -d temp_extract
        if [ -d "temp_extract/turbodrive" ]; then
          cp -r temp_extract/turbodrive/. .
        else
          cp -r temp_extract/. .
        fi

    - name: Configure Buildozer Spec
      run: |
        rm -f buildozer.spec
        buildozer init

        python3 -c "
        import re

        spec_file = 'buildozer.spec'
        with open(spec_file, 'r') as f:
            lines = f.readlines()

        keys_to_set = {
            'title': 'TurboDrive',
            'package.name': 'turbodrive',
            'requirements': 'python3,kivy==2.3.0',
            'android.accept_sdk_license': 'True',
            'android.api': '33',
            'android.ndk': '26b',
            'android.archs': 'arm64-v8a'
        }

        new_lines = []
        found_keys = set()

        for line in lines:
            matched_key = None
            for k in keys_to_set:
                if re.match(rf'^\s*#?\s*{re.escape(k)}\s*=', line):
                    matched_key = k
                    break
            if matched_key:
                if matched_key not in found_keys:
                    new_lines.append(f'{matched_key} = {keys_to_set[matched_key]}\n')
                    found_keys.add(matched_key)
            else:
                new_lines.append(line)

        for k, v in keys_to_set.items():
            if k not in found_keys:
                new_lines.append(f'{k} = {v}\n')

        with open(spec_file, 'w') as f:
            f.writelines(new_lines)
        "

    - name: Build APK
      run: |
        echo "cython==0.29.36" > /tmp/constraints.txt
        export PIP_CONSTRAINT=/tmp/constraints.txt
        python -m pip install "cython==0.29.36" --force-reinstall
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
