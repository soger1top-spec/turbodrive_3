name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: "apk-build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract Files
      run: |
        unzip -o turbodrive.zip -d temp_extract
        if [ -d "temp_extract/turbodrive" ]; then
          cp -r temp_extract/turbodrive/. .
        else
          cp -r temp_extract/. .
        fi

    - name: Create Clean buildozer.spec
      run: |
        # إنشاء ملف إعدادات جديد كلياً ونظيف 100% بدون أي أوامر تعديل
        cat <<EOF > buildozer.spec
        [app]
        title = TurboDrive
        package.name = turbodrive
        package.domain = org.ibrahim.turbodrive
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,wav,mp3
        version = 1.0
        requirements = python3,kivy==2.3.0
        orientation = all
        fullscreen = 1
        android.archs = arm64-v8a
        android.accept_sdk_license = True
        android.api = 33
        android.minapi = 24
        android.ndk = 25b
        [buildozer]
        log_level = 2
        warn_on_root = 0
        EOF

    - name: Build APK with Buildozer Action
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        command: buildozer android debug
        buildozer_version: master

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
