name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: "apk-build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Free Space & RAM
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc
        sudo apt-get clean

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        python -m pip install --upgrade pip setuptools virtualenv
        python -m pip install "cython==0.29.36" buildozer

    - name: Extract Files
      run: |
        unzip -o turbodrive.zip -d temp_extract
        if [ -d "temp_extract/turbodrive" ]; then
          cp -r temp_extract/turbodrive/. .
        else
          cp -r temp_extract/. .
        fi

    - name: Create Clean buildozer.spec
      run: |
        # إنشاء ملف إعدادات نظيف كلياً بدون أي تكرار
        cat <<EOF > buildozer.spec
        [app]
        title = TurboDrive
        package.name = turbodrive
        package.domain = org.ibrahim.turbodrive
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,wav,mp3
        version = 1.0
        requirements = python3,kivy==2.3.0
        orientation = all
        fullscreen = 1
        android.archs = arm64-v8a
        android.accept_sdk_license = True
        android.api = 33
        android.minapi = 24
        android.ndk = 25b
        p4a.branch = master
        [buildozer]
        log_level = 2
        warn_on_root = 0
        EOF

    - name: Build APK
      run: |
        # حصار يمنع تحميل Cython 3 المضروب في الخلفية
        echo "cython==0.29.36" > /tmp/constraints.txt
        export PIP_CONSTRAINT=/tmp/constraints.txt
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
