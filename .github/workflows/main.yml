name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: "apk-build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Free Space & RAM
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip setuptools
        pip install "cython==0.29.36" virtualenv buildozer

    - name: Extract Files
      run: |
        unzip -o turbodrive.zip -d temp_extract
        if [ -d "temp_extract/turbodrive" ]; then
          cp -r temp_extract/turbodrive/* .
        else
          cp -r temp_extract/* .
        fi

    - name: Configure Buildozer Spec
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
          sed -i 's/title = My Application/title = TurboDrive/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = turbodrive/g' buildozer.spec
        fi
        # إعدادات الاستقرار ومنع التعارض
        sed -i 's/.*android.accept_sdk_license.*/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/.*android.ndk =.*/android.ndk = 25b/' buildozer.spec
        sed -i 's/.*android.api =.*/android.api = 33/' buildozer.spec
        sed -i 's/.*android.archs =.*/android.archs = arm64-v8a/' buildozer.spec

    - name: Build APK
      run: |
        pip install "cython==0.29.36" --force-reinstall
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
